<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fa;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#333;
}
.container{
text-align:center;
max-width:600px;
padding:40px;
}
h1{
font-size:120px;
color:#0d6efd;
margin-bottom:10px;
}
h2{
font-size:32px;
margin-bottom:20px;
}
p{
font-size:18px;
line-height:1.6;
color:#666;
margin-bottom:30px;
}
a{
display:inline-block;
padding:14px 30px;
background:#0d6efd;
color:#fff;
text-decoration:none;
border-radius:5px;
transition:.3s;
}
a:hover{
background:#0b5ed7;
}
</style>

</head>
<body>

<div class="container">
<h1>404</h1>
<h2>Page Not Found</h2>
<p>The page you are looking for may have been moved, deleted, or never existed.</p>
<a href="/">Go to Homepage</a>
</div>

</body>
</html>
