<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>403 - Access Forbidden</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,Helvetica,sans-serif;
background:#fff8f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#333;
}
.container{
text-align:center;
max-width:600px;
padding:40px;
}
h1{
font-size:120px;
color:#dc3545;
margin-bottom:10px;
}
h2{
font-size:32px;
margin-bottom:20px;
}
p{
font-size:18px;
line-height:1.6;
color:#666;
margin-bottom:30px;
}
a{
display:inline-block;
padding:14px 30px;
background:#dc3545;
color:#fff;
text-decoration:none;
border-radius:5px;
transition:.3s;
}
a:hover{
background:#bb2d3b;
}
</style>

</head>
<body>

<div class="container">
<h1>403</h1>
<h2>Access Forbidden</h2>
<p>You don't have permission to access this page or resource.</p>
<a href="/">Return Home</a>
</div>

</body>
</html>
